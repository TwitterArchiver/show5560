  我早上刚起床就被冻感冒了，原来是没盖被子。那被子呢？我抬头一看，原来是在天花板上。
  <br/>
  我弯着腰进了地铁，旁边的大哥说，你为什么把腿放在座位上？我笑了说，那不是腿。
  <br/>

  <br/>
