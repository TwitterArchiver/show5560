  有个男子，因为思念病逝的兄弟在那个兄弟的坟前开玩笑地说，兄弟，我老婆快生了，你要是不嫌弃的话，就投他来当我的儿子吧。
  <br/>
  后来，他的妻子真的生下了一个儿子，男子竟然还发现孩子的眉眼间和过世的兄弟有几分相像，所以他越发笃定，这就是兄弟投胎转世。
  <br/>
  随着孩子渐渐的长大，有一天男子发现窝在沙发上玩手机的儿子的模样，仿佛过世的兄弟就在面前。
  <br/>
  他激动地喊来妻子老婆，快来看咱们儿子跟我兄弟简直一模一样。这下你该相信人有来世了吧，一定是我兄弟听见了我的话，才转世成了咱儿子。
  <br/>
  妻子听后先是一愣，随即连声附和。 是的是的，他一定是听到了你的呼唤，才回到咱们身边的。
