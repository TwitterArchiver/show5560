  别人叫朋友都是兴趣相同，而我交朋友则是臭味相投，没有什么特别苛刻的选择标准。
  <br/>
  我就喜欢找一些看着很傻的人当兄弟，主要是太聪明的人我玩不过，太强壮的人我打不过，太会说的人会显得我很笨。所以我会找一个比我更傻的。
  <br/>
  我总是能在一堆金粒中，精准的找到那颗沙子，这何尝不是一种天赋呢？
  <br/>
  虽说长辈总是劝导我们，不要和不三不四的人交朋友，但我的朋友看上去不是很二就是太六，所以说坚固的友情不是惺惺相惜，而是病情一致。
  <br/>
  兄弟这下知道我为什么选你了吧😋
